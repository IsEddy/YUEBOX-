<main id="s4-ar" class="screen" data-screen="S4" data-verb="唤物">
  <section class="cam">
    <video data-el="video" playsinline muted autoplay></video>
    <img data-el="demoimg" class="demo-img" alt="" hidden>
    <span class="cam-scrim" aria-hidden="true"></span>
  </section>

  <header class="head">
    <span class="seq">04</span>
    <h1>唤物</h1>
    <p data-el="hint">对准展品，它会自己说话</p>
  </header>

  <div class="detect" data-el="detect">
    <span class="cn"></span><span class="cn"></span><span class="cn"></span><span class="cn"></span>
    <span class="glow"></span>
    <span class="scan"></span>
  </div>

  <div class="anno" data-el="anno">
    <div class="panel">
      <p class="k"><span class="tw" data-el="aname"></span></p>
      <p class="v" data-el="adesc"></p>
      <p class="meta"><span data-el="adyn"></span><span class="sep">·</span><span data-el="acat"></span></p>
    </div>
    <div class="stem"></div>
    <div class="dot"></div>
  </div>

  <div class="hit-tip" data-el="hit-tip" hidden>
    <span class="conf" data-el="conf"></span>
    <span class="hname" data-el="hname"></span>
  </div>

  <div class="bottom">
    <div class="build" data-el="build" hidden>
      <div class="bar"><i data-el="barfill"></i></div>
      <span data-el="buildtxt">正在装载藏品库…</span>
    </div>

    <div class="acts">
      <button class="primary-btn" type="button" data-action="start">
        <svg width="18" height="18" aria-hidden="true"><use href="#ic-04"/></svg>开启相机识别
      </button>
      <button class="secondary-btn" type="button" data-action="demo">用示例画面试</button>
    </div>
    <p class="foot">识别在本机完成，不上传照片</p>
  </div>

  <nav class="tabbar" aria-label="主导航">
    <a href="splash.html"><svg aria-hidden="true"><use href="#ic-01"/></svg><span>宝盒</span></a>
    <a href="category.html"><svg aria-hidden="true"><use href="#ic-02"/></svg><span>分格</span></a>
    <a href="ar.html" aria-current="page"><svg aria-hidden="true"><use href="#ic-04"/></svg><span>唤物</span></a>
    <a href="category.html?drawer=1"><svg aria-hidden="true"><use href="#ic-05"/></svg><span>藏印</span></a>
  </nav>
  <div class="home-indicator" aria-hidden="true"></div>
</main>

<script src="vision.js"></script>
<script src="data/relics.js"></script>
<script src="data/gm-collection.js"></script>
<script>
(function () {
  const root = document.getElementById('s4-ar');
  const q = (s) => root.querySelector(s);
  const V = window.YBX_VISION;
  const R = window.RELICS || {};
  const ALL = window.GM_COLLECTION || [];

  const video = q('[data-el="video"]');
  const demoimg = q('[data-el="demoimg"]');
  const detect = q('[data-el="detect"]');
  const anno = q('[data-el="anno"]');
  const hint = q('[data-el="hint"]');
  const buildBox = q('[data-el="build"]');
  const barfill = q('[data-el="barfill"]');
  const buildtxt = q('[data-el="buildtxt"]');
  const hitTip = q('[data-el="hit-tip"]');
  const confEl = q('[data-el="conf"]');
  const hnameEl = q('[data-el="hname"]');

  let index = [];
  let building = false;
  let stream = null;
  let loopTimer = null;
  let mode = 'idle';
  let lastHit = null;

  function buildList() {
    const out = [];
    (window.FEATURED || []).forEach(id => {
      const r = R[id];
      if (r && r.img) out.push({ id: 'relic:' + id, name: r.name, img: r.img, src: 'relic', key: id });
    });
    // 本地缩略图优先（同源无跨域），其次才用远程原图
    for (const it of ALL) {
      if (!it.i) continue;
      const src = it.t || it.i;
      out.push({ id: 'gm:' + it.id, name: it.n, img: src, src: 'gm', key: it.id });
      if (out.length >= 127) break;
    }
    return out;
  }

  async function ensureIndex() {
    if (index.length || building) return;
    building = true;
    const list = buildList();
    buildBox.hidden = false;
    buildtxt.textContent = '正在装载藏品库（' + list.length + ' 件）…';
    const raw = await V.buildIndex(list, (done, total) => {
      const p = Math.round(done / total * 100);
      barfill.style.width = p + '%';
      buildtxt.textContent = '正在装载藏品库 ' + p + '%';
    });
    index = raw;
    building = false;
    buildBox.hidden = true;
    hint.textContent = '藏品库已就绪 · ' + index.length + ' 件';
  }

  function grabFrame() {
    if (mode === 'camera') return video.videoWidth ? video : null;
    if (mode === 'demo') return demoimg.naturalWidth ? demoimg : null;
    return null;
  }

  function recognizeOnce() {
    const frame = grabFrame();
    if (!frame || !index.length) return;
    const res = V.match(index, frame, { threshold: 0.6 });
    if (!res) return;
    if (res.matched) {
      if (lastHit && lastHit.id === res.item.id && Date.now() - lastHit.t < 2500) return;
      lastHit = { id: res.item.id, t: Date.now() };
      showHit(res);
    } else {
      showMiss(res);
    }
  }

  function showHit(res) {
    const it = res.item;
    let detail = null;
    if (it.src === 'relic') detail = R[it.key];
    if (!detail && it.src === 'gm') detail = ALL.find(x => x.id === it.key);

    place({ x: 12, y: 16, w: 76, h: 58 });

    q('[data-el="aname"]').textContent = it.name;
    var why = (detail && (detail.why || detail.desc)) || '';
    q('[data-el="adesc"]').textContent = why ? why.slice(0, 60) : '识别到馆藏藏品，点开查看详情';
    q('[data-el="adyn"]').textContent = (detail && (detail.dynasty || detail.d)) || '';
    q('[data-el="acat"]').textContent = (detail && (detail.category || detail.c)) || '';

    detect.classList.add('on');
    root.classList.add('hit');
    anno.classList.remove('on');
    requestAnimationFrame(function () {
      anno.classList.add('on');
      hitTip.hidden = false;
      confEl.textContent = Math.round(res.confidence * 100) + '%';
      hnameEl.textContent = it.name;
    });
    hint.textContent = '已识别 · ' + it.name;
    anno.dataset.target = (it.src === 'gm' ? 'detail-gm.html?id=' + it.key : 'detail.html?id=' + it.key);
  }

  function showMiss(res) {
    if (anno.classList.contains('on')) return;
    root.classList.remove('hit');
    detect.classList.remove('on');
    hitTip.hidden = false;
    confEl.textContent = Math.round((res.confidence || 0) * 100) + '%';
    hnameEl.textContent = '未匹配（最接近 ' + (res.item ? res.item.name : '—') + '）';
    hint.textContent = '把它放进取景框中央再试';
  }

  function place(t) {
    const r = root.getBoundingClientRect();
    const TOP = 178, BOT = 700;
    const bx = r.width * t.x / 100;
    const bw = r.width * t.w / 100;
    var by = Math.max(TOP, r.height * t.y / 100);
    var bh = r.height * t.h / 100;
    if (by + bh > BOT) bh = BOT - by;
    detect.style.left = bx + 'px';
    detect.style.top = by + 'px';
    detect.style.width = bw + 'px';
    detect.style.height = bh + 'px';
    detect.style.setProperty('--sh', Math.round(bh) + 'px');

    const panelW = 240;
    anno.style.width = panelW + 'px';
    const panelH = Math.round(anno.querySelector('.panel').getBoundingClientRect().height) || 96;
    var ax = bx + bw / 2 - panelW / 2;
    ax = Math.max(12, Math.min(ax, r.width - panelW - 12));
    // 标注卡固定在框下方，绝不压住框内提示
    var ay = by + bh + 10;
    var above = false;
    if (ay + panelH > BOT) {
      ay = by - panelH - 10;      // 下方放不下就放上方
      above = true;
    }
    if (ay < TOP) ay = TOP;
    if (ay + panelH > BOT) ay = BOT - panelH;
    anno.style.left = ax + 'px';
    anno.style.top = ay + 'px';
    anno.querySelector('.stem').style.display = above ? 'block' : 'none';
  }

  function startLoop() {
    stopLoop();
    loopTimer = setInterval(recognizeOnce, 700);
    detect.classList.add('on');
  }
  function stopLoop() {
    if (loopTimer) { clearInterval(loopTimer); loopTimer = null; }
  }

  async function startCamera() {
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      hint.textContent = '这个浏览器不支持相机，用示例画面试';
      return;
    }
    try {
      stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
      video.srcObject = stream;
      await video.play().catch(function () {});
      mode = 'camera';
      demoimg.hidden = true;
      video.hidden = false;
      await ensureIndex();
      hint.textContent = '把展品放进取景框 · 每 0.7 秒识别一次';
      startLoop();
    } catch (e) {
      hint.textContent = '没有拿到相机权限，可以用示例画面试';
    }
  }

  async function startDemo() {
    const firstRelic = (window.FEATURED || []).map(function (id) { return R[id]; })
      .find(function (r) { return r && r.img; });
    const firstGm = ALL.find(function (x) { return x.i; });
    const pic = firstRelic ? { img: firstRelic.img, name: firstRelic.name } :
      (firstGm ? { img: firstGm.i, name: firstGm.n } : null);
    if (!pic) { hint.textContent = '藏品图不足，无法演示'; return; }
    stopLoop();
    if (stream) { stream.getTracks().forEach(function (t) { t.stop(); }); stream = null; }
    video.hidden = true;
    demoimg.src = pic.img;
    demoimg.hidden = false;
    mode = 'demo';
    await ensureIndex();
    hint.textContent = '示例画面 · 正在比对藏品库';
    startLoop();
  }

  root.addEventListener('click', async function (e) {
    const t = e.target.closest('[data-action]');
    if (!t) return;
    if (t.dataset.action === 'start') {
      t.disabled = true;
      t.textContent = '正在开启…';
      await startCamera();
      t.textContent = '相机已开启';
    }
    if (t.dataset.action === 'demo') {
      await startDemo();
    }
  });

  anno.addEventListener('click', function () {
    if (anno.dataset.target) location.href = anno.dataset.target;
  });

  setTimeout(function () { ensureIndex(); }, 600);
})();
</script>
</body>
