<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=375, initial-scale=1">
<meta name="dsh-design" content="app 375x812">
<title>04 · AR 扫描页 · 唤物</title>
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="app.css">
<link rel="stylesheet" href="motion.css">
<link rel="stylesheet" href="s4.css">
</head>
<body>
<main id="s4-ar" class="screen" data-screen="S4" data-verb="唤物">
  <section class="layer s4-cam" data-layer="00_相机底" aria-hidden="true">
    <img src="img/c2_shenkan_close.jpg" alt="">
    <span class="s4-mask"></span>
    <span class="s4-vig"></span>
  </section>

  <header class="layer s4-head" data-layer="20_顶部">
    <span class="seq">04</span>
    <h1>唤物</h1>
    <p>把镜头对准展签<br>或试着唤出下面这几件</p>
  </header>

  <section class="layer" data-layer="30_取景框">
    <div class="s4-frame" data-frame>
      <span class="cn"></span><span class="cn"></span><span class="cn"></span><span class="cn"></span>
      <span class="cross"></span>
      <span class="scan-line" aria-hidden="true"></span>
    </div>
  </section>

  <!-- 底部控件组：结果出现时整体收起 -->
  <div class="s4-bottom" data-layer="40_底部控件">
    <section class="layer s4-examples">
      <div class="row">
        <button type="button" data-example="molong"><span class="thumb"><img src="img/c1_molong.jpg" alt="墨龙图"></span><span>墨龙图</span></button>
        <button type="button" data-example="shenkan"><span class="thumb"><img src="img/c2_shenkan.jpg" alt="大神龛"></span><span>大神龛</span></button>
        <button type="button" data-example="fan"><span class="thumb"><img src="img/c8_fan.jpg" alt="外销扇"></span><span>外销扇</span></button>
      </div>
    </section>

    <section class="layer s4-status">
      <p data-status>对准展签或文物</p>
    </section>

    <section class="layer s4-actions">
      <button class="primary-btn" type="button" data-action="scan">开始识别</button>
      <button class="secondary-btn" type="button" data-action="demo">没有实物？试试示例</button>
    </section>
  </div>

  <div class="layer s4-particles" data-layer="65_粒子" aria-hidden="true">
    <i style="left:60px;top:300px"></i><i style="left:96px;top:286px"></i><i style="left:132px;top:304px"></i><i style="left:168px;top:288px"></i>
    <i style="left:204px;top:306px"></i><i style="left:240px;top:292px"></i><i style="left:276px;top:308px"></i><i style="left:312px;top:296px"></i>
    <i style="left:120px;top:340px"></i><i style="left:192px;top:348px"></i><i style="left:264px;top:342px"></i><i style="left:336px;top:334px"></i>
  </div>

  <section class="s4-result" data-result role="dialog" aria-label="识别结果">
    <div class="thumb"><img src="img/c1_molong.jpg" alt="墨龙图"></div>
    <h2>它出来了。</h2>
    <p>南宋·陈容《墨龙图》，一条在留白里翻身的龙。</p>
    <a class="go" href="detail.html">看看它</a>
  </section>

  <section class="layer s4-fail" data-fail hidden>
    <p>这件宝贝还在盒子里睡觉，换一件试试？</p>
  </section>

  <section class="layer s4-noperm" data-noperm hidden>
    <div class="inner">
      <svg width="32" height="32" style="margin:0 auto;color:var(--gold-500)" aria-hidden="true"><use href="#ic-04"/></svg>
      <h2>没有相机也能玩</h2>
      <p>进入演示模式，从示例里唤出一件宝贝。</p>
      <button class="primary-btn" type="button" data-action="demo">进入演示模式</button>
    </div>
  </section>

  <section class="layer" data-layer="70_TabBar">
    <nav class="tabbar" aria-label="主导航">
      <a href="splash.html"><svg aria-hidden="true"><use href="#ic-01"/></svg><span>宝盒</span></a>
      <a href="category.html"><svg aria-hidden="true"><use href="#ic-02"/></svg><span>分格</span></a>
      <a href="ar.html" aria-current="page"><svg aria-hidden="true"><use href="#ic-04"/></svg><span>唤物</span></a>
      <a href="category.html?drawer=1"><svg aria-hidden="true"><use href="#ic-05"/></svg><span>藏印</span></a>
    </nav>
    <div class="home-indicator" aria-hidden="true"></div>
  </section>
</main>
<script>
const root = document.getElementById('s4-ar');
const p = new URLSearchParams(location.search);
const status = root.querySelector('[data-status]');
const result = root.querySelector('[data-result]');
const frame = root.querySelector('[data-frame]');
const particles = root.querySelector('.s4-particles');
const fail = root.querySelector('[data-fail]');
const noperm = root.querySelector('[data-noperm]');

function setStatus(t) { status.textContent = t; }

function reset() {
  root.classList.remove('showing-result');
  root.classList.remove('scanning');
  result.classList.remove('on');
  fail.hidden = true;
  particles.classList.remove('go');
  frame.style.transform = '';
  frame.style.opacity = '1';
  setStatus('对准展签或文物');
}

function succeed() {
  root.classList.remove('scanning');
  setStatus('它出来了。');
  frame.style.transform = 'scale(1)';
  particles.classList.add('go');
  setTimeout(() => {
    result.classList.add('on');
    root.classList.add('showing-result');   // 收起底部控件
    frame.style.opacity = '0';
  }, 240);
}

function scanning() {
  setStatus('正在唤醒它…');
  root.classList.add('scanning');
  frame.style.transform = 'scale(1.06)';
  setTimeout(() => { frame.style.transform = 'scale(1)'; }, 240);
  setTimeout(succeed, 1200);
}

if (p.get('state') === 'noperm') { noperm.hidden = false; }
if (p.get('state') === 'success') { setTimeout(succeed, 300); }
if (p.get('state') === 'fail') {
  setTimeout(() => {
    fail.hidden = false;
    setStatus('这件宝贝还在盒子里睡觉，换一件试试？');
  }, 300);
}

root.addEventListener('click', (e) => {
  const t = e.target.closest('[data-action],[data-example]');
  if (!t) return;
  if (t.dataset.example) { reset(); scanning(); return; }
  const a = t.dataset.action;
  if (a === 'scan') { reset(); scanning(); }
  if (a === 'demo') { noperm.hidden = true; reset(); scanning(); }
});
</script>
</body>
</html>
