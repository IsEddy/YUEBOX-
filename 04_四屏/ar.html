<script>
(function () {
  const root = document.getElementById('s4-ar');
  const p = new URLSearchParams(location.search);
  const R = window.RELICS || {};
  const q = (s) => root.querySelector(s);

  const detect = q('[data-detect]');
  const anno = q('[data-anno]');
  const status = q('[data-status]');
  const fail = q('[data-fail]');
  const noperm = q('[data-noperm]');
  const particles = q('.s4-particles');

  /* 识别目标：从文物库自动生成，不局限于固定几件。
     每件的框位在画面里随机但不重叠，模拟「对准哪件就框哪件」。 */
  const TARGETS = {};
  (function buildTargets() {
    const ids = Object.keys(R).slice(0, 8);
    const slots = [
      { x:10, y:14, w:78, h:62 },
      { x:22, y:8,  w:54, h:76 },
      { x:16, y:16, w:66, h:58 },
      { x:26, y:20, w:48, h:50 },
      { x:12, y:26, w:74, h:44 },
      { x:18, y:10, w:62, h:70 },
      { x:24, y:24, w:52, h:46 },
      { x:14, y:18, w:70, h:56 }
    ];
    ids.forEach((id, i) => {
      if (slots[i]) TARGETS[id] = slots[i];
    });
  })();

  let current = null;

  function reset() {
    root.classList.remove('showing-result');
    detect.classList.remove('on');
    anno.classList.remove('on');
    particles.classList.remove('go');
    fail.hidden = true;
    status.textContent = '把镜头对准展品';
    current = null;
  }

  function place(t) {
    const r = root.getBoundingClientRect();
    const TOP_SAFE = 170, BOT_SAFE = 700;
    const bx = r.width * t.x / 100;
    const bw = r.width * t.w / 100;
    // 识别框限制在 170 ~ 700 之间
    let by = Math.max(TOP_SAFE, r.height * t.y / 100);
    let bh = r.height * t.h / 100;
    if (by + bh > BOT_SAFE) bh = BOT_SAFE - by;
    detect.style.left = bx + 'px';
    detect.style.top = by + 'px';
    detect.style.width = bw + 'px';
    detect.style.height = bh + 'px';
    detect.style.setProperty('--sh', Math.round(bh) + 'px');

    const panel = anno.querySelector('.panel');
    const panelW = 240;
    let ax = bx + bw / 2 - panelW / 2;
    ax = Math.max(12, Math.min(ax, r.width - panelW - 12));
    anno.style.width = panelW + 'px';
    const panelH = panel.offsetHeight || 92;
    let ay = by - panelH - 26;
    const above = ay >= 100;
    if (!above) ay = by + bh + 16;
    // 不许压到 TabBar（722 上沿）和底部按钮
    // 标注卡必须完整落在安全区内（上 180 / 下 700）
    const SAFE_BOTTOM = 700;
    ay = Math.min(ay, SAFE_BOTTOM - panelH);
    if (ay < 180) ay = Math.max(180, SAFE_BOTTOM - panelH);
    if (ay + panelH > SAFE_BOTTOM) ay = SAFE_BOTTOM - panelH;
    anno.style.left = ax + 'px';
    anno.style.top = ay + 'px';
    anno.style.width = panelW + 'px';
    anno.querySelector('.stem').style.display = above ? 'block' : 'none';
  }

  function annotate(id) {
    const relic = R[id];
    const t = TARGETS[id];
    if (!relic || !t) {
      fail.hidden = false;
      status.textContent = '没认出来，换个角度试试';
      return;
    }
    current = id;

    /* 1) 先填内容，再测高度（否则测到的是旧高度，文字会被裁） */
    q('[data-anno-name]').textContent = relic.name;
    q('[data-anno-desc]').textContent = relic.why;
    q('[data-anno-dyn]').textContent = relic.dynasty;
    q('[data-anno-cat]').textContent = relic.category;

    /* 2) 放识别框 */
    const r = root.getBoundingClientRect();
    const TOP_SAFE = 178, BOT_SAFE = 700;
    const bx = r.width * t.x / 100;
    const bw = r.width * t.w / 100;
    let by = Math.max(TOP_SAFE, r.height * t.y / 100);
    let bh = r.height * t.h / 100;
    if (by + bh > BOT_SAFE) bh = BOT_SAFE - by;
    detect.style.left = bx + 'px';
    detect.style.top = by + 'px';
    detect.style.width = bw + 'px';
    detect.style.height = bh + 'px';
    detect.style.setProperty('--sh', Math.round(bh) + 'px');

    /* 3) 内容已就位，此时测量才准确 */
    const panelW = 240;
    anno.style.width = panelW + 'px';
    anno.style.left = '0px';
    anno.style.top = '0px';
    const panelH = Math.round(anno.querySelector('.panel').getBoundingClientRect().height) || 96;

    let ax = bx + bw / 2 - panelW / 2;
    ax = Math.max(12, Math.min(ax, r.width - panelW - 12));
    let ay = by - panelH - 28;
    let above = ay >= TOP_SAFE;
    if (!above) ay = by + bh + 16;
    /* 必须完整落在安全区内 */
    if (ay + panelH > BOT_SAFE) ay = BOT_SAFE - panelH;
    if (ay < TOP_SAFE) { ay = TOP_SAFE; above = false; }
    anno.style.left = ax + 'px';
    anno.style.top = ay + 'px';
    anno.querySelector('.stem').style.display = above ? 'block' : 'none';

    /* 4) 动画 */
    detect.classList.add('on');
    anno.classList.remove('on');
    requestAnimationFrame(() => {
      ano_show();
    });
    function ano_show() {
      anno.classList.add('on');
      status.textContent = '已识别 · ' + relic.name;
      particles.classList.add('go');
      root.classList.add('showing-result');
      fail.hidden = true;
    }
  }

  function scanning() {
    reset();
    status.textContent = '正在辨认…';
    detect.style.left = '24px';
    detect.style.top = '210px';
    detect.style.width = '327px';
    detect.style.height = '250px';
    detect.style.setProperty('--sh', '250px');
    detect.classList.add('on');
    setTimeout(() => {
      const ids = Object.keys(TARGETS);
      annotate(ids[Math.floor(Math.random() * ids.length)]);
    }, 1500);
  }

  if (p.get('state') === 'noperm') noperm.hidden = false;
  if (p.get('state') === 'fail') setTimeout(() => { fail.hidden = false; status.textContent = '没认出来'; }, 300);
  if (p.get('state') === 'hit') setTimeout(() => annotate(p.get('id') || 'shenkan'), 400);

  root.addEventListener('click', (e) => {
    const t = e.target.closest('[data-action]');
    if (!t) return;
    const a = t.dataset.action;
    if (a === 'scan') scanning();
    if (a === 'reset') reset();
    if (a === 'demo') { noperm.hidden = true; scanning(); }
  });

  anno.addEventListener('click', () => {
    if (current) location.href = 'detail.html?id=' + current;
  });
})();
</script>
