<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=375, initial-scale=1">
<meta name="dsh-design" content="app 375x812">
<title>02 · 文物分类 · 分格</title>
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="app.css">
<link rel="stylesheet" href="motion.css">
<link rel="stylesheet" href="s2.css">
</head>
<body>
<main id="s2-category" class="screen" data-screen="S2" data-verb="分格">
  <header class="statusbar" aria-label="状态栏">
    <span>9:41</span>
    <span class="right">
      <svg width="16" height="16" aria-hidden="true"><use href="#ic-signal"/></svg>
      <svg width="16" height="16" aria-hidden="true"><use href="#ic-wifi"/></svg>
      <svg width="22" height="16" aria-hidden="true"><use href="#ic-battery"/></svg>
    </span>
  </header>

  <div class="s2-head enter" style="--i:0">
    <span class="seq">02</span>
    <h1>分格</h1>
    <button class="icon-btn white s2-search-btn" type="button" aria-label="搜索" data-action="search">
      <svg aria-hidden="true"><use href="#ic-06"/></svg>
    </button>
  </div>

  <button class="s2-search enter" style="--i:1" type="button" data-action="search" aria-label="搜一件宝贝">
    <svg aria-hidden="true"><use href="#ic-06"/></svg><span>搜一件宝贝</span>
  </button>

  <div class="s2-seg enter" style="--i:2" role="tablist" aria-label="视图切换" data-active="grid">
    <span class="thumb-slide" aria-hidden="true"></span>
    <a role="tab" aria-selected="true" href="category.html" data-view-btn="grid">格</a>
    <a role="tab" aria-selected="false" href="category.html?view=axis" data-view-btn="axis">轴</a>
  </div>
  <span class="s2-seg-note enter" style="--i:2">按工艺看，也按年代看</span>

  <section class="s2-picks enter" style="--i:3">
    <span class="rail-note">约 8 分钟看完</span>
    <div class="rail" role="list" data-el="featured"></div>
  </section>

  <section class="s2-grid" data-view="grid">
    <div class="grid" role="list" data-el="grid"></div>
  </section>

  <section class="s2-axis" data-view="axis" hidden>
    <div class="axis-seg">
      <span class="node"></span>
      <h3>唐宋元</h3>
      <p>墨龙图（南宋）· 南海丝路</p>
    </div>
    <div class="axis-seg">
      <span class="node"></span>
      <h3>明清</h3>
      <p>大神龛（清）· 猴王砚（清光绪）· 广彩（清道光）</p>
    </div>
    <div class="axis-seg">
      <span class="node"></span>
      <h3>近现代</h3>
      <p>外销扇（19 世纪）· 金鸡报晓</p>
    </div>
  </section>

  <section class="s2-empty" data-state="empty" hidden>
    <div class="inner">
      <svg width="32" height="32" aria-hidden="true"><use href="#ic-06"/></svg>
      <h2>这一格还是空的</h2>
      <p>换个词试试，或者从这三件开始</p>
      <div class="recs" data-el="recs"></div>
    </div>
  </section>

  <nav class="tabbar" aria-label="主导航">
    <a href="splash.html"><svg aria-hidden="true"><use href="#ic-01"/></svg><span>宝盒</span></a>
    <a href="category.html" aria-current="page"><svg aria-hidden="true"><use href="#ic-02"/></svg><span>分格</span></a>
    <a href="ar.html"><svg aria-hidden="true"><use href="#ic-04"/></svg><span>唤物</span></a>
    <a href="category.html?drawer=1"><svg aria-hidden="true"><use href="#ic-05"/></svg><span>藏印</span></a>
  </nav>
  <div class="home-indicator" aria-hidden="true"></div>

  <div class="drawer-scrim" data-action="close-drawer" aria-hidden="true"></div>
  <section class="drawer" data-drawer="cangyin" aria-label="藏印抽屉" aria-hidden="true">
    <button class="drawer-close" type="button" data-action="close-drawer" aria-label="关闭藏印">
      <svg width="20" height="20" aria-hidden="true"><use href="#ic-10"/></svg>
    </button>
    <div class="handle" aria-hidden="true"></div>
    <h2>藏印</h2>
    <p>把喜欢的宝贝，收进你的印盒。</p>
    <div class="seal" aria-hidden="true"><i></i></div>
    <div class="acts">
      <button class="primary-btn" type="button" data-action="seal">盖一枚印</button>
      <button class="secondary-btn" type="button" data-action="share">
        <svg width="16" height="16" aria-hidden="true"><use href="#ic-08"/></svg>分享卡片
      </button>
    </div>
  </section>
</main>

<script src="data/relics.js"></script>
<script src="motion.js"></script>
<script>
(function () {
  const root = document.getElementById('s2-category');
  const p = new URLSearchParams(location.search);
  const R = window.RELICS;
  const q = (s) => root.querySelector(s);

  q('[data-el="featured"]').innerHTML = window.FEATURED.map(id => {
    const r = R[id];
    return `<a class="pick" role="listitem" href="detail.html?id=${id}" data-relic="${id}">
      <span class="thumb"><img src="${r.img}" alt="${r.dynasty}${r.name}"></span>
      <span class="meta"><b>${r.name}</b><span>${r.tag}</span></span>
    </a>`;
  }).join('');

  const cards = window.CATEGORIES.map(c => {
    const r = R[c.relic];
    return `<a class="gcard" role="listitem" href="detail.html?id=${c.relic}" data-relic="${c.relic}" data-plate="${c.plate}">
      <span class="pic"><img src="${r.img}" alt="${c.name}代表文物${r.name}"></span>
      <span class="txt"><p class="name">${c.name}</p><p class="sub">${c.sub}</p></span>
      <span class="corner" aria-hidden="true"></span>
    </a>`;
  }).join('');
  q('[data-el="grid"]').innerHTML = cards + '<div class="gcard empty" aria-hidden="true"></div>';

  q('[data-el="recs"]').innerHTML = window.FEATURED.slice(0, 3).map(id => {
    const r = R[id];
    return `<a href="detail.html?id=${id}" data-relic="${id}"><img src="${r.img}" alt="${r.name}"></a>`;
  }).join('');

  const seg = q('.s2-seg');
  const gridEl = q('[data-view="grid"]');
  const axisEl = q('[data-view="axis"]');
  const picksEl = q('.s2-picks');
  function setView(v) {
    seg.dataset.active = v;
    gridEl.hidden = v !== 'grid';
    axisEl.hidden = v !== 'axis';
    root.querySelectorAll('[data-view-btn]').forEach(a =>
      a.setAttribute('aria-selected', String(a.dataset.viewBtn === v)));
  }
  if (p.get('view') === 'axis') setView('axis');
  seg.addEventListener('click', (e) => {
    const a = e.target.closest('[data-view-btn]');
    if (!a) return;
    e.preventDefault();
    setView(a.dataset.viewBtn);
    history.replaceState(null, '', a.dataset.viewBtn === 'axis' ? '?view=axis' : 'category.html');
  });

  function showEmpty(on) {
    q('[data-state="empty"]').hidden = !on;
    picksEl.hidden = on;
    gridEl.hidden = on || seg.dataset.active !== 'grid';
    axisEl.hidden = on || seg.dataset.active !== 'axis';
  }
  if (p.get('state') === 'empty') showEmpty(true);

  const drawer = q('[data-drawer]');
  const scrim = q('.drawer-scrim');
  function openDrawer(on) {
    drawer.classList.toggle('open', on);
    scrim.classList.toggle('open', on);
    drawer.setAttribute('aria-hidden', String(!on));
    root.classList.toggle('drawer-open', on);
  }
  if (p.get('drawer') === '1') openDrawer(true);

  root.addEventListener('click', (e) => {
    const t = e.target.closest('[data-action]');
    if (!t) return;
    const a = t.dataset.action;
    if (a === 'search') { location.href = 'category.html?state=empty'; }
    if (a === 'close-drawer') {
      history.replaceState(null, '', 'category.html');
      openDrawer(false);
    }
    if (a === 'seal') { t.textContent = '已收进印盒'; t.disabled = true; }
  });
})();
</script>
</body>
</html>
