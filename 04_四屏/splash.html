<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=375, initial-scale=1">
<meta name="dsh-design" content="app 375x812">
<title>01 · 启动页 · 推开</title>
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="app.css">
<link rel="stylesheet" href="motion.css">
</head>
<body>
<svg xmlns="http://www.w3.org/2000/svg" style="position:absolute;width:0;height:0;overflow:hidden" aria-hidden="true">
  <!-- YUEBOX 图标：24 网格 / 1.5 线宽 / 方头端点 / 直角 -->
  <symbol id="ic-01" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="square" stroke-linejoin="miter"><path d="M12 5 19 9 12 13 5 9Z"/><path d="M5 9 12 13 12 19 5 15Z"/><path d="M12 13 19 9 19 15 12 19Z"/><path d="M9 9 15 9"/></g></symbol>
  <symbol id="ic-02" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="square"><rect x="4" y="4" width="16" height="16"/><path d="M12 4v16M4 12h16"/><rect x="4" y="4" width="8" height="8" fill="currentColor" stroke="none"/></g></symbol>
  <symbol id="ic-03" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="square"><rect x="4" y="4" width="16" height="16"/><path d="M9 8v8M12 7v10M15 9v6"/></g></symbol>
  <symbol id="ic-04" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="square"><path d="M4 8V4h4M16 4h4v4M20 16v4h-4M8 20H4v-4"/><rect x="10" y="10" width="4" height="4"/></g></symbol>
  <symbol id="ic-05" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="square"><rect x="5" y="5" width="14" height="14"/><circle cx="12" cy="12" r="2.4" fill="currentColor" stroke="none"/></g></symbol>
  <symbol id="ic-06" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="square"><rect x="4" y="4" width="12" height="12"/><path d="m14 14 6 6"/></g></symbol>
  <symbol id="ic-07" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="square" stroke-linejoin="miter"><path d="M15 5 8 12l7 7"/></g></symbol>
  <symbol id="ic-08" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="square"><path d="M14 4h6v6M20 4l-9 9"/><path d="M15 10v10H4V10"/></g></symbol>
  <symbol id="ic-09" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="square"><rect x="4" y="4" width="16" height="16"/><path d="m10 8 6 4-6 4Z"/></g></symbol>
  <symbol id="ic-10" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="square"><path d="M6 6l12 12M18 6 6 18"/></g></symbol>
  <symbol id="ic-11" viewBox="0 0 24 24"><g fill="currentColor"><circle cx="4" cy="12" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="20" cy="12" r="1.5"/></g></symbol>
  <symbol id="ic-signal" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="square"><path d="M3 16v3M8 13v6M13 9v10M18 5v14"/></g></symbol>
  <symbol id="ic-wifi" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="square"><path d="M3 9a15 15 0 0 1 18 0M6 12a10 10 0 0 1 12 0M9 15a6 6 0 0 1 6 0"/><circle cx="12" cy="19" r="1" fill="currentColor" stroke="none"/></g></symbol>
  <symbol id="ic-battery" viewBox="0 0 28 24"><g fill="none" stroke="currentColor" stroke-width="1.4"><rect x="2" y="7" width="21" height="10" rx="1"/><path d="M25 10v4"/><rect x="4" y="9" width="14" height="6" fill="currentColor" stroke="none"/></g></symbol>
</svg>

<!--#include file="icons.svg"-->
<main id="s1-splash" class="screen" data-screen="S1" data-verb="推开">
  <section class="layer s1-bg" data-layer="00_底色">
    <header class="statusbar" aria-label="状态栏"><span>9:41</span><span class="right"><svg width="16" height="16" aria-hidden="true"><use href="#ic-signal"/></svg><svg width="16" height="16" aria-hidden="true"><use href="#ic-wifi"/></svg><svg width="22" height="16" aria-hidden="true"><use href="#ic-battery"/></svg></span></header>
    <a class="s1-skip" href="category.html" style="z-index:60">跳过</a>
    <span class="corner-seq s1-seq">01</span>
  </section>
  <section class="layer s1-hero" data-layer="20_内容层">
    <div class="s1-halo" aria-hidden="true"></div>
    <div class="s1-seam" aria-hidden="true"></div>
    <div class="s1-lid-top" aria-hidden="true"></div>
    <div class="s1-lid-bottom" aria-hidden="true"></div>
    <div class="s1-vermilion" aria-hidden="true"></div>
  </section>
  <section class="layer" data-layer="30_品牌区" style="pointer-events:none">
    <div class="s1-brand">
      <h1 aria-label="粤博·宝盒"><span>粤</span><span>博</span><span>·</span><span>宝</span><span>盒</span></h1>
      <p>广东省博物馆数字导览</p>
    </div>
    <p class="s1-quote">轻推，宝盒开了。</p>
    <div class="s1-progress" aria-label="启动进度">
      <div class="track"><div class="fill"></div></div>
      <div class="s1-version">YUEBOX · 数字宝盒</div>
    </div>
  </section>
  <section class="layer s1-state" data-layer="50_状态层" data-state="loading" hidden>
    <div class="state-inner">
      <div class="state-ring" aria-hidden="true"></div>
      <h2 class="state-title">正在开盒…</h2>
      <p class="state-copy">把馆藏一件一件，放进你的口袋。</p>
      <a class="primary-btn" href="category.html">进入宝盒</a>
    </div>
  </section>
  <section class="layer s1-state" data-layer="50_状态层" data-state="error" hidden>
    <div class="state-inner">
      <svg width="32" height="32" style="margin:0 auto;color:var(--gold-500)" aria-hidden="true"><use href="#ic-01"/></svg>
      <h2 class="state-title">盒子卡住了，轻触重试</h2>
      <p class="state-copy">连接不太稳定，但宝贝都还在。</p>
      <a class="retry" href="splash.html">重新推开</a>
    </div>
  </section>
  <a class="layer" href="category.html" aria-label="进入文物分类页" style="z-index:5"></a>
</main>
<script>
// 开盒后自动进入分类页；状态层用 data-state 切换，不生成第五屏。
const s1 = document.getElementById('s1-splash');
const params = new URLSearchParams(location.search);
const state = params.get('state');
if (state === 'loading' || state === 'error') {
  s1.querySelector(`[data-state="${state}"]`).hidden = false;
} else if (params.get('auto') !== '0') {
  setTimeout(() => {
    if (!document.hidden) location.href = 'category.html';
  }, 1800);
}
</script>
</body>
</html>
