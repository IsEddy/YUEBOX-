<body>

  <symbol id="ic-02" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="square"><rect x="4" y="4" width="16" height="16"/><path d="M12 4v16M4 12h16"/><rect x="4" y="4" width="8" height="8" fill="currentColor" stroke="none"/></g></symbol>
  <symbol id="ic-03" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="square"><rect x="4" y="4" width="16" height="16"/><path d="M9 8v8M12 7v10M15 9v6"/></g></symbol>
  <symbol id="ic-04" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="square"><path d="M4 8V4h4M16 4h4v4M20 16v4h-4M8 20H4v-4"/><rect x="10" y="10" width="4" height="4"/></g></symbol>
  <symbol id="ic-05" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="square"><rect x="5" y="5" width="14" height="14"/><circle cx="12" cy="12" r="2.4" fill="currentColor" stroke="none"/></g></symbol>
  <symbol id="ic-06" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="square"><rect x="4" y="4" width="12" height="12"/><path d="m14 14 6 6"/></g></symbol>
  <symbol id="ic-07" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="square"><path d="M15 5 8 12l7 7"/></g></symbol>
  <symbol id="ic-signal" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="square"><path d="M3 16v3M8 13v6M13 9v10M18 5v14"/></g></symbol>
  <symbol id="ic-wifi" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="square"><path d="M3 9a15 15 0 0 1 18 0M6 12a10 10 0 0 1 12 0M9 15a6 6 0 0 1 6 0"/><circle cx="12" cy="19" r="1" fill="currentColor" stroke="none"/></g></symbol>

</svg>

<main id="s1-home" class="screen" data-screen="S1" data-verb="推开">
  <div class="curtain" data-curtain aria-hidden="true">
    <div class="curtain-glow"></div>
    <div class="curtain-seam"></div>
    <div class="curtain-brand"><h2>粤博 · 宝盒</h2><p>广东省博物馆数字导览</p></div>
    <p class="curtain-line">轻启，宝盒方开。</p>
  </div>

  <header class="statusbar" aria-label="状态栏">
    <span>9:41</span>
    <span class="right">
      <svg width="16" height="16" aria-hidden="true"><use href="#ic-signal"/></svg>
      <svg width="16" height="16" aria-hidden="true"><use href="#ic-wifi"/></svg>
      <svg width="22" height="16" aria-hidden="true"><use href="#ic-battery"/></svg>
    </span>
  </header>

  <div class="brand-row">
    <div class="brand">
      <span class="bn">粤博 · 宝盒</span>
      <span class="bs">广东省博物馆 · 数字导览</span>
    </div>
    <button class="search-btn" type="button" aria-label="搜索" data-action="search">
      <svg width="20" height="20" aria-hidden="true"><use href="#ic-06"/></svg>
    </button>
  </div>

  <a class="hero" href="detail.html?id=molong" data-el="hero">
    <span class="hero-img"><img data-el="hero-img" src="" alt=""></span>
    <span class="hero-scrim" aria-hidden="true"></span>
    <span class="hero-txt">
      <span class="hero-tag">今日一珍 ·  <b data-el="herodate"></b></span>
      <span class="hero-name" data-el="hero-name">—</span>
      <span class="hero-why" data-el="hero-why">—</span>
    </span>
    <span class="hero-arrow" aria-hidden="true">›</span>
  </a>

  <nav class="entries" aria-label="功能入口">
    <a class="entry" href="collection.html">
      <span class="ei"><svg width="22" height="22" aria-hidden="true"><use href="#ic-03"/></svg></span>
      <span class="et">全馆藏品</span>
      <span class="es"><b data-el="total">—</b> 件</span>
    </a>
    <a class="entry" href="venues.html">
      <span class="ei"><svg width="22" height="22" aria-hidden="true"><use href="#ic-01"/></svg></span>
      <span class="et">虚拟展厅</span>
      <span class="es"><b data-el="ven">—</b> 个</span>
    </a>
    <a class="entry" href="ar.html">
      <span class="ei"><svg width="22" height="22" aria-hidden="true"><use href="#ic-04"/></svg></span>
      <span class="et">唤物识珍</span>
      <span class="es">对准展品</span>
    </a>
    <a class="entry" href="seal.html">
      <span class="ei"><svg width="22" height="22" aria-hidden="true"><use href="#ic-05"/></svg></span>
      <span class="et">我的藏印</span>
      <span class="es">已藏 3 枚</span>
    </a>
  </nav>

  <section class="rail-wrap">
    <div class="rail-head">
      <h2>馆藏甄选</h2>
      <a href="category.html">循工艺观览 ›</a>
    </div>
    <div class="rail" data-el="rail"></div>
  </section>

  <nav class="tabbar" aria-label="主导航">
    <a href="splash.html" aria-current="page"><svg aria-hidden="true"><use href="#ic-01"/></svg><span>宝盒</span></a>
    <a href="category.html"><svg aria-hidden="true"><use href="#ic-02"/></svg><span>分格</span></a>
    <a href="ar.html"><svg aria-hidden="true"><use href="#ic-04"/></svg><span>唤物</span></a>
    <a href="seal.html"><svg aria-hidden="true"><use href="#ic-05"/></svg><span>藏印</span></a>
  </nav>
  <div class="home-indicator" aria-hidden="true"></div>
</main>

<script src="back.js"></script>
<script src="data/relics.js"></script>
<script src="data/gm-collection.js"></script>
<script src="data/gm-venues.js"></script>
<script src="data/fingerprints.js"></script>
<script src="daily.js"></script>
<script>
(function () {
  const root = document.getElementById('s1-home');
  const q = (s) => root.querySelector(s);
  const p = new URLSearchParams(location.search);
  const R = window.RELICS || {};
  const ALL = window.GM_COLLECTION || [];
  const V = window.GM_VENUES || [];

  q('[data-el="total"]').textContent = (ALL.length || 0).toLocaleString();
  q('[data-el="ven"]').textContent = V.length || 0;

  /* 今日一件：按日期从全馆藏品里轮换，不写死 */
  const FP = window.YBX_FP || [];
  const D = window.YBX_DAILY;
  const today = D ? D.pickDaily(FP) : null;
  if (today) {
    /* hero 用原图（缩略图只有 200px，放大后糊）；加载失败退回缩略图 */
    var heroImg = q('[data-el="hero-img"]');
    heroImg.src = today.i || today.t;
    heroImg.onerror = function () { heroImg.onerror = null; heroImg.src = today.t; };
    heroImg.alt = today.n;
    q('[data-el="hero-name"]').textContent = today.n;
    const meta = [today.d, today.c].filter(Boolean).join(' · ');
    q('[data-el="hero-why"]').textContent = meta || '今日馆藏';
    q('[data-el="hero"]').href = 'detail-gm.html?id=' + today.id;
  } else {
    // 兜底：用精选第一件
    const feat = (window.FEATURED || ['molong']);
    const h0 = R[feat[0]] || {};
    if (h0.img) q('[data-el="hero-img"]').src = h0.img;
    q('[data-el="hero-name"]').textContent = h0.name || '—';
    q('[data-el="hero-why"]').textContent = h0.why ? h0.why.slice(0, 24) + '…' : '';
    q('[data-el="hero"]').href = 'detail.html?id=' + feat[0];
  }

  /* 横滑：今日三件，全部来自有缩略图的藏品 */
  const three = D ? D.pickDailyN(FP, 3) : [];
  if (three.length) {
    q('[data-el="rail"]').innerHTML = three.map(function (x) {
      return '<a class="rcard" href="detail-gm.html?id=' + x.id + '">'
        + '<span class="rc-img"><img src="' + x.t + '" alt="' + x.n + '" loading="lazy"></span>'
        + '<span class="rc-name">' + x.n + '</span>'
        + '<span class="rc-tag">' + ([x.d, x.c].filter(Boolean)[0] || '馆藏') + '</span></a>';
    }).join('');
  } else {
    const feat = (window.FEATURED || ['molong']);
    q('[data-el="rail"]').innerHTML = feat.map(function (id) {
      const r = R[id] || {};
      return '<a class="rcard" href="detail.html?id=' + id + '">'
        + '<span class="rc-img">' + (r.img ? '<img src="' + r.img + '" alt="' + (r.name||'') + '">' : '') + '</span>'
        + '<span class="rc-name">' + (r.name || '') + '</span>'
        + '<span class="rc-tag">' + (r.tag || '') + '</span></a>';
    }).join('');
  }

  const curtain = q('[data-curtain]');
  if (p.get('skip') === '1') {
    curtain.remove();
  } else {
    const kill = () => {
      curtain.classList.add('off');
      setTimeout(() => curtain.remove(), 380);
    };
    setTimeout(kill, 1400);
    curtain.addEventListener('click', kill);
  }

  if (q('[data-el="herodate"]')) {
    const t = new Date();
    q('[data-el="herodate"]').textContent = (t.getMonth() + 1) + ' 月 ' + t.getDate() + ' 日';
  }

  q('[data-action="search"]').addEventListener('click', () => {
    location.href = 'collection.html?focus=1';
  });
})();
</script>
</body>
</html>
