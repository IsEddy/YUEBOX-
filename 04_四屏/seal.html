<main id="s9-seal" class="screen" data-screen="S9" data-verb="藏印">
  <header class="statusbar" aria-label="状态栏">
    <span>9:41</span>
    <span class="right">
      <svg width="16" height="16" aria-hidden="true"><use href="#ic-signal"/></svg>
      <svg width="16" height="16" aria-hidden="true"><use href="#ic-wifi"/></svg>
      <svg width="22" height="16" aria-hidden="true"><use href="#ic-battery"/></svg>
    </span>
  </header>

  <div class="head enter" style="--i:0">
    <span class="seq">09</span>
    <h1>我的印盒</h1>
    <p class="sub">已藏 <b data-el="count">0</b> 枚 · 留存本机</p>
    <a class="head-back" href="splash.html" aria-label="返回上一页" data-back>
      <svg aria-hidden="true"><use href="#ic-07"/></svg>
    </a>
  </div>

  <!-- 印盒封面：一排朱印，表示"被盖过的痕迹" -->
  <section class="seal-case" aria-hidden="true">
    <div class="case-inner">
      <span class="stamp"></span><span class="stamp"></span><span class="stamp"></span>
    </div>
    <span class="case-label">印盒</span>
  </section>

  <!-- 收藏列表 -->
  <section class="seal-list" data-el="list"></section>

  <!-- 空态 -->
  <section class="empty" data-el="empty" hidden>
    <div class="empty-seal" aria-hidden="true"><span>空</span></div>
    <h2>印盒尚空</h2>
    <p>在藏品详情页点击右上角印鉴，<br>心仪古物便会钤入此处。</p>
    <a class="primary-btn" href="collection.html">前去甄选</a>
  </section>

  <!-- 底部操作 -->
  <div class="foot-acts" data-el="footacts" hidden>
    <button class="secondary-btn" type="button" data-action="share">生成印谱卡</button>
    <button class="text-btn" type="button" data-action="clear">清空印盒</button>
  </div>

  <nav class="tabbar" aria-label="主导航">
    <a href="splash.html"><svg aria-hidden="true"><use href="#ic-01"/></svg><span>宝盒</span></a>
    <a href="category.html"><svg aria-hidden="true"><use href="#ic-02"/></svg><span>分格</span></a>
    <a href="ar.html"><svg aria-hidden="true"><use href="#ic-04"/></svg><span>唤物</span></a>
    <a href="seal.html" aria-current="page"><svg aria-hidden="true"><use href="#ic-05"/></svg><span>藏印</span></a>
  </nav>
  <div class="home-indicator" aria-hidden="true"></div>
</main>

<script src="back.js"></script>
<script src="seals.js"></script>
<script>
(function () {
  const root = document.getElementById('s9-seal');
  const q = (s) => root.querySelector(s);
  const S = window.YBX_SEAL;

  function fmtDate(ts) {
    const d = new Date(ts || Date.now());
    return (d.getMonth() + 1) + '月' + d.getDate() + '日';
  }

  function render() {
    const items = S.list();
    q('[data-el="count"]').textContent = items.length;
    q('[data-el="empty"]').hidden = items.length > 0;
    q('[data-el="footacts"]').hidden = items.length === 0;
    q('[data-el="list"]').hidden = items.length === 0;

    q('[data-el="list"]').innerHTML = items.map(function (x, i) {
      const img = x.t ? '<img src="' + x.t + '" alt="' + (x.n || '') + '" loading="lazy">' : '';
      const meta = [x.d, x.c].filter(Boolean).join(' · ');
      return '<a class="seal-item" href="detail-gm.html?id=' + x.id + '" style="--i:' + i + '">'
        + '<span class="si-img">' + img + '<span class="si-mark">印</span></span>'
        + '<span class="si-body">'
        + '<span class="si-name">' + (x.n || '') + '</span>'
        + '<span class="si-meta">' + (meta || '馆藏') + '</span>'
        + '</span>'
        + '<span class="si-date">' + fmtDate(x.at) + '</span>'
        + '<button class="si-del" type="button" data-del="' + x.id + '" aria-label="取消收藏">'
        + '<svg width="15" height="15" aria-hidden="true"><use href="#ic-10"/></svg></button>'
        + '</a>';
    }).join('');

    // 印盒封面：已藏藏就点亮
    root.classList.toggle('has-seal', items.length > 0);
  }

  root.addEventListener('click', function (e) {
    const del = e.target.closest('[data-del]');
    if (del) {
      e.preventDefault();
      e.stopPropagation();
      S.remove(del.dataset.del);
      render();
      return;
    }
    const act = e.target.closest('[data-action]');
    if (!act) return;
    if (act.dataset.action === 'clear') {
      if (confirm('清空印盒？' + S.count() + ' 枚印会一起清掉。')) {
        S.clear();
        render();
      }
    }
    if (act.dataset.action === 'share') {
      act.textContent = '印谱卡已生成';
      setTimeout(function () { act.textContent = '生成印谱卡'; }, 1600);
    }
  });

  render();
})();
</script>
</body>
</html>
