<main id="s3-detail" class="screen light" data-screen="S3" data-verb="接近">
  <div class="s3-scroll">
    <section class="s3-figure" data-plate="silk">
      <div class="plate" data-el="plate">
        <img class="art" data-el="img" src="" alt="">
        <span class="fiber" aria-hidden="true"></span>
        <span class="vig" aria-hidden="true"></span>
        <div class="hotspots" data-el="hotspots"></div>
      </div>
    </section>

    <div class="mount" aria-hidden="true"></div>

    <section class="s3-title enter" style="--i:1">
      <h1 data-el="name">—</h1>
      <p class="info" data-el="info"></p>
    </section>

    <section class="s3-glance enter" style="--i:2">
      <div class="glance-row"><span class="dot"></span><span class="k">是什么</span><p class="v" data-el="what"></p></div>
      <div class="glance-row"><span class="dot"></span><span class="k">厉害在哪</span><p class="v" data-el="why"></p></div>
      <div class="glance-row"><span class="dot"></span><span class="k">怎么看</span><p class="v" data-el="how"></p></div>
    </section>

    <section class="s3-craft enter" style="--i:3">
      <h2>工艺分解</h2>
      <div class="craft-rail" data-el="craft"></div>
    </section>

    <div class="s3-pad" aria-hidden="true"></div>
  </div>

  <div class="s3-top" aria-hidden="true"></div>
  <div class="s3-controls">
    <a class="icon-btn white" href="category.html" aria-label="返回分类页" data-back>
      <svg aria-hidden="true"><use href="#ic-07"/></svg>
    </a>
    <button class="icon-btn white" type="button" aria-label="收藏这件" data-action="collect">
      <svg aria-hidden="true"><use href="#ic-05"/></svg>
    </button>
  </div>

  <div data-el="hscards"></div>

  <div class="s3-cta-wrap">
    <a class="s3-cta" href="model3d.html?id=guangcai">
      <svg aria-hidden="true"><use href="#ic-04"/></svg>唤出实物
    </a>
  </div>

  <div class="s3-loading" data-state="loading" hidden>
    <div><div class="ring" aria-hidden="true"></div><p>正在展开图版…</p></div>
  </div>
</main>

<script src="data/relics.js"></script>
<script src="motion.js"></script>
<script>
(function () {
  const params = new URLSearchParams(location.search);
  const id = params.get('id') || 'molong';
  const R = (window.RELICS || {})[id] || window.RELICS.molong;
  const root = document.getElementById('s3-detail');
  const q = (sel) => root.querySelector(sel);

  document.title = `${R.seq} · ${R.name} · 接近`;

  const figure = q('.s3-figure');
  figure.dataset.plate = R.plate || 'silk';

  const img = q('[data-el="img"]');
  img.src = R.img;
  img.alt = `${R.dynasty}${R.name}，${R.material}`;

  /* 图版按素材实比例定高：宽 375，高 = 375 / ratio，上限 460 */
  /* 图版高度 = 屏宽 / 素材真实比例，完整显示不裁切 */
  const plate = q('[data-el="plate"]');
  let ph = Math.round(375 / R.ratio);
  const MAXH = 480;
  if (ph > MAXH) ph = MAXH;
  plate.style.width = '375px';
  plate.style.height = ph + 'px';
  figure.style.height = ph + 'px';

  q('[data-el="name"]').textContent = R.name;
  q('[data-el="info"]').innerHTML =
    `<span>${R.dynasty}</span>·<span>${R.material}</span>·<span>${R.size}</span>`;
  q('[data-el="what"]').textContent = R.what;
  q('[data-el="why"]').textContent = R.why;
  q('[data-el="how"]').textContent = R.how;

  q('[data-el="craft"]').innerHTML = R.craft.map(c =>
    `<div class="craft"><b>${c.k}</b><span>${c.n}</span></div>`).join('');

  /* 热点必须落在「图片实际显示区」内，而不是整个图版 */
  function fitHotspotBox() {
    const wrap = q('[data-el="hotspots"]');
    const pimg = q('[data-el="img"]');
    const pr = plate.getBoundingClientRect();
    const iw = pimg.naturalWidth, ih = pimg.naturalHeight;
    if (!iw || !ih) return;
    const scale = Math.min(pr.width / iw, pr.height / ih);
    const dw = iw * scale, dh = ih * scale;
    const ox = (pr.width - dw) / 2, oy = (pr.height - dh) / 2;
    wrap.style.left = Math.round(ox) + 'px';
    wrap.style.top = Math.round(oy) + 'px';
    wrap.style.width = Math.round(dw) + 'px';
    wrap.style.height = Math.round(dh) + 'px';
    wrap.style.right = 'auto';
    wrap.style.bottom = 'auto';
  }
  const hsWrap = q('[data-el="hotspots"]');
  const cardWrap = q('[data-el="hscards"]');
  hsWrap.innerHTML = R.hotspots.map((h, i) => `
    <button class="hotspot" type="button" data-hotspot="${i}"
            style="left:${h.x}%;top:${h.y}%" aria-label="热点：${h.title}">
      <i></i>
    </button>`).join('');
  cardWrap.innerHTML = R.hotspots.map((h, i) => `
    <div class="hs-card" data-card="${i}" role="dialog" aria-label="${h.title}">
      <button class="close" type="button" data-close aria-label="关闭">
        <svg width="16" height="16" aria-hidden="true"><use href="#ic-10"/></svg>
      </button>
      <h3>${h.title}</h3><p>${h.text}</p>
    </div>`).join('');

  const cards = [...cardWrap.querySelectorAll('.hs-card')];
  hsWrap.addEventListener('click', (e) => {
    const btn = e.target.closest('[data-hotspot]');
    if (!btn) return;
    const i = btn.dataset.hotspot;
    const card = cardWrap.querySelector(`[data-card="${i}"]`);
    const isOpen = card.classList.contains('on');
    cards.forEach(c => c.classList.remove('on'));
    if (isOpen) return;
    const br = btn.getBoundingClientRect();
    const cw = 280;
    const ch = card.offsetHeight || 130;
    let left = br.left + br.width / 2 - cw / 2;
    left = Math.max(12, Math.min(left, 375 - cw - 12));
    let top = br.top + br.height + 10;
    if (top + ch > 700) top = Math.max(96, br.top - ch - 10);
    card.style.left = left + 'px';
    card.style.top = top + 'px';
    card.classList.add('on');
  });
  cardWrap.addEventListener('click', (e) => {
    if (e.target.closest('[data-close]')) cards.forEach(c => c.classList.remove('on'));
  });

  const collect = q('[data-action="collect"]');
  collect.addEventListener('click', () => {
    const on = collect.getAttribute('aria-pressed') === 'true';
    collect.setAttribute('aria-pressed', String(!on));
    collect.style.color = on ? '' : 'var(--gold-500)';
  });

  const pimg = q('[data-el="img"]');
  if (pimg.complete) requestAnimationFrame(fitHotspotBox);
  else pimg.addEventListener('load', () => requestAnimationFrame(fitHotspotBox), { once: true });
  addEventListener('resize', fitHotspotBox);

  if (params.get('state') === 'loading') {
    const el = q('[data-state="loading"]');
    el.hidden = false;
    setTimeout(() => { el.hidden = true; }, 1400);
  }
})();
</script>
</body>
</html>
